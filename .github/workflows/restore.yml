name: Restore Fitness Frontend Source
on:
  push:
    branches: [main]
    paths:
      - 'encoded/part05.txt'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand verified frontend archive
        run: |
          cat encoded/part00.txt encoded/part01.txt encoded/part02.txt encoded/part03.txt encoded/part04.txt encoded/part05.txt | base64 --decode | tar -xz
          test -s public/index.html
          test -s public/app.js
          test -s public/style.css
          node --check public/app.js
      - name: Commit and push frontend files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js public/style.css
          git diff --cached --quiet || git commit -m 'Add complete fitness command center frontend'
          git push
